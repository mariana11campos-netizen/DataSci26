<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrooveAcademy - Educational Drum Machine</title>
    <style>
        :root {
            --bg-main: #0f111a;
            --bg-card: #1a1d2e;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent-kick: #ef4444;
            --accent-snare: #3b82f6;
            --accent-hihat: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --grid-off: #2e3456;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #818cf8, #e0e7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            margin-top: 5px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background-color: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 24px;
            border: 1px solid #2e3456;
        }

        /* Control Panel Styles */
        .control-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 2px solid #2e3456;
            margin-bottom: 24px;
        }

        .playback-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        button {
            cursor: pointer;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            padding: 12px 24px;
            font-size: 1rem;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #334155;
            color: var(--text-main);
            padding: 12px 18px;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .tempo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #111424;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #2e3456;
        }

        .tempo-container input[type="range"] {
            accent-color: var(--primary);
            cursor: pointer;
        }

        #tempo-val {
            font-weight: bold;
            min-width: 60px;
            color: #818cf8;
        }

        /* Lesson Hub Styles */
        .lesson-hub {
            background: linear-gradient(135deg, #1e1b4b 0%, #111424 100%);
            border: 1px solid #4338ca;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .lesson-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .lesson-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select {
            background-color: #0f111a;
            color: white;
            border: 1px solid #4338ca;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-weight: 500;
        }

        .lesson-instructions {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #312e81;
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-top: 12px;
            font-size: 0.85rem;
        }

        .stat-badge {
            background: rgba(99, 102, 241, 0.15);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .stat-badge span {
            font-weight: bold;
            color: #a5b4fc;
        }

        /* Sequencer Grid Styles */
        .sequencer {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .beat-markers {
            display: flex;
            margin-left: 100px;
            padding-left: 10px;
        }

        .marker-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            flex: 1;
            text-align: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--text-muted);
            border-right: 1px solid rgba(255,255,255,0.05);
        }
        .marker-group:last-child { border: none; }

        .track {
            display: flex;
            align-items: center;
        }

        .track-label {
            width: 100px;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .track-label.kick { color: var(--accent-kick); }
        .track-label.snare { color: var(--accent-snare); }
        .track-label.hihat { color: var(--accent-hihat); }

        .grid-row {
            display: flex;
            flex: 1;
            gap: 6px;
            padding: 4px;
            background: #111424;
            border-radius: 8px;
        }

        .step {
            flex: 1;
            aspect-ratio: 1;
            min-width: 35px;
            background-color: var(--grid-off);
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.15s ease;
            position: relative;
            border: 2px solid transparent;
        }

        .step:hover {
            transform: scale(1.05);
            background-color: #3b426f;
        }

        /* Step States */
        .step.active[data-instrument="kick"] { background-color: var(--accent-kick); box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
        .step.active[data-instrument="snare"] { background-color: var(--accent-snare); box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .step.active[data-instrument="hihat"] { background-color: var(--accent-hihat); box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }

        /* Lesson Target Hint Ring */
        .step.target-hint {
            border: 2px dashed #f59e0b;
            animation: pulse-border 2s infinite;
        }

        /* Current Playing Step Column Highlight */
        .step.playing {
            filter: brightness(1.4);
            outline: 2px solid #ffffff;
        }

        @keyframes pulse-border {
            0% { border-color: rgba(245, 158, 11, 0.4); }
            50% { border-color: rgba(245, 158, 11, 1); }
            100% { border-color: rgba(245, 158, 11, 0.4); }
        }

        /* Simple Beat Indicator Dots */
        .indicators {
            display: flex;
            margin-left: 100px;
            gap: 6px;
            padding: 0 4px;
            margin-top: -4px;
        }
        .ind-dot {
            flex: 1;
            height: 4px;
            background: transparent;
            border-radius: 2px;
        }
        .ind-dot.playing {
            background: #ffffff;
            box-shadow: 0 0 8px #fff;
        }

        /* Shade alterations to visually chunk 4x4 blocks */
        .grid-row .step:nth-child(4n+1),
        .grid-row .step:nth-child(4n+2),
        .grid-row .step:nth-child(4n+3),
        .grid-row .step:nth-child(4n+4) {
            opacity: 0.9;
        }
        .grid-row .step:nth-child(12), .grid-row .step:nth-child(13),
        .grid-row .step:nth-child(14), .grid-row .step:nth-child(15),
        .grid-row .step:nth-child(16), .grid-row .step:nth-child(1),
        .grid-row .step:nth-child(2), .grid-row .step:nth-child(3),
        .grid-row .step:nth-child(4) {
            background-color: #242946;
        }
    </style>
</head>
<body>

    <header>
        <h1>GrooveAcademy</h1>
        <p>Interactive Step Sequencer &amp; Rhythm Tutor</p>
    </header>

    <div class="container">
        
        <!-- Learning/Tutorial Dashboard -->
        <section class="lesson-hub">
            <div class="lesson-header">
                <div class="lesson-selector">
                    <label for="lesson-select"><strong>Choose Lesson:</strong></label>
                    <select id="lesson-select">
                        <option value="none">Free Play (No Guidance)</option>
                        <option value="rock">1. The Classic Rock Beat (Basic)</option>
                        <option value="dance">2. Four-on-the-Floor (Electronic)</option>
                        <option value="hiphop">3. Boom-Bap Hip Hop (Syncopated)</option>
                    </select>
                </div>
                <div>
                    <button class="btn-primary" id="btn-start-lesson">Start Lesson</button>
                </div>
            </div>
